name: Test error on credential missing password
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove any existing netrc
        run: rm -f "$HOME/.netrc"
      - id: action
        uses: .
        continue-on-error: true
        with:
          creds: '[{"machine": "github.com", "login": "test-bot"}]'
      - name: Assert action failed and wrote nothing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for credential without password"
            exit 1
          fi
          if [ -s "$HOME/.netrc" ]; then
            echo "FAIL: netrc should not contain data"
            cat "$HOME/.netrc"
            exit 1
          fi
          echo "PASS"
