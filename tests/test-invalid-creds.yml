name: Test invalid creds input fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean netrc
        run: rm -f "$HOME/.netrc"
      - id: action
        uses: .
        continue-on-error: true
        with:
          creds: '{"machine": "github.com", "login": "x", "password": "y"}'
      - name: Assert action failed and wrote nothing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-array creds"
            exit 1
          fi
          if [ -f "$HOME/.netrc" ] && grep -q "github.com" "$HOME/.netrc"; then
            echo "FAIL: credentials should not have been written"
            exit 1
          fi
          echo "PASS"
