name: Test single entry
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean netrc
        run: rm -f "$HOME/.netrc"
      - id: action
        uses: .
        with:
          machine: some.other.api.com
          login: person
          password: 1234qwer
      - name: Assert netrc contents
        run: |
          NETRC="$HOME/.netrc"
          if [ ! -f "$NETRC" ]; then
            echo "FAIL: $NETRC not created"
            exit 1
          fi
          cat "$NETRC"
          for line in "machine some.other.api.com" "login person" "password 1234qwer"; do
            if ! grep -qxF "$line" "$NETRC"; then
              echo "FAIL: missing line '$line'"
              exit 1
            fi
          done
          PERM="$(stat -c '%a' "$NETRC")"
          echo "perm: $PERM"
          if [ "$PERM" != "600" ]; then
            echo "FAIL: expected permissions 600"
            exit 1
          fi
          echo "PASS"
